# Armadra 本地 dev-stack（docs/design/external-services.md §14）。
#
# 用 `pnpm dev-stack up` 起，不要直接 `docker compose up`：脚本先生成
# `.data/dev.env` 里的随机开发密钥（不进仓库），再带着它调 compose。
# 所有端口只绑 127.0.0.1；镜像全部钉到明确版本。端口表与健康检查在
# `tools/dev-stack/services.mjs`，`stack.test.mjs` 守住两者一致。
#
# 这份文件只用 workflow-yaml.mjs 认识的 YAML 子集（不用锚点与合并键），
# 这样没装 Docker 的机器上测试也能解析它。
name: armadra-dev

services:
  release:
    image: node:22.23.3-bookworm-slim
    working_dir: /repo
    command: ["node", "tools/dev-stack/release-entry.mjs"]
    environment:
      MOCK_RELEASE_HOST: "0.0.0.0"
      MOCK_RELEASE_PORT: "8090"
      MOCK_RELEASE_PUBLIC_BASE: "http://127.0.0.1:8090"
      RELEASE_KEY_DIR: /keys
    volumes:
      - ../../tools:/repo/tools:ro
      - ./.data/release:/keys
    ports:
      - "127.0.0.1:8090:8090"
    healthcheck:
      test:
        - CMD
        - node
        - "-e"
        - "fetch('http://127.0.0.1:8090/repos/armadra/armadra/releases').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  pebble:
    image: ghcr.io/letsencrypt/pebble:2.10.1
    environment:
      # 不真去回连挑战地址：签发、续期与失败路径照走，验证一律放行。
      # 要测真实 HTTP-01 / TLS-ALPN-01 时把它改成 "0"。
      PEBBLE_VA_ALWAYS_VALID: "1"
      PEBBLE_VA_NOSLEEP: "1"
    ports:
      - "127.0.0.1:14000:14000"
      - "127.0.0.1:15000:15000"
    restart: unless-stopped

  step-ca:
    image: smallstep/step-ca:0.30.2
    environment:
      DOCKER_STEPCA_INIT_NAME: "Armadra dev-stack CA"
      DOCKER_STEPCA_INIT_DNS_NAMES: "localhost,127.0.0.1,step-ca"
      DOCKER_STEPCA_INIT_ACME: "true"
      # 首次启动时镜像自己生成 CA 口令，写在卷里，不经过这份文件。
    volumes:
      - step-ca:/home/step
    ports:
      - "127.0.0.1:9000:9000"
    restart: unless-stopped

  dex:
    image: ghcr.io/dexidp/dex:v2.45.1
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    volumes:
      - ./dex/config.yaml:/etc/dex/config.yaml:ro
    ports:
      - "127.0.0.1:5556:5556"
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.5
    command: ["start-dev", "--import-realm", "--http-port=8080"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:?run pnpm dev-stack up}"
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak:/opt/keycloak/data/import:ro
    ports:
      - "127.0.0.1:8080:8080"
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1.31.4
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  gitea:
    image: gitea/gitea:1.27.3
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__database__DB_TYPE: sqlite3
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__ROOT_URL: "http://127.0.0.1:3000/"
      GITEA__server__HTTP_PORT: "3000"
      GITEA__server__DISABLE_SSH: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__log__LEVEL: Warn
    volumes:
      - gitea:/data
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:3000/api/healthz"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  glitchtip-postgres:
    image: postgres:17.11-alpine
    environment:
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: "${GLITCHTIP_DB_PASSWORD:?run pnpm dev-stack up}"
      POSTGRES_DB: glitchtip
    volumes:
      - glitchtip-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "glitchtip", "-d", "glitchtip"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  glitchtip-redis:
    image: redis:8.8.3-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  glitchtip:
    image: glitchtip/glitchtip:6.2.6
    depends_on:
      glitchtip-postgres:
        condition: service_healthy
      glitchtip-redis:
        condition: service_healthy
    environment:
      SERVER_ROLE: all_in_one
      DATABASE_URL: "postgres://glitchtip:${GLITCHTIP_DB_PASSWORD:?run pnpm dev-stack up}@glitchtip-postgres:5432/glitchtip"
      VALKEY_URL: "redis://glitchtip-redis:6379/0"
      SECRET_KEY: "${GLITCHTIP_SECRET_KEY:?run pnpm dev-stack up}"
      GLITCHTIP_DOMAIN: "http://127.0.0.1:8000"
      DEFAULT_FROM_EMAIL: "glitchtip@armadra.test"
      EMAIL_URL: "smtp://mailpit:1025"
      ENABLE_USER_REGISTRATION: "true"
    ports:
      - "127.0.0.1:8000:8000"
    healthcheck:
      test:
        - CMD
        - python3
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/_health/').status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  push-sink:
    image: node:22.23.3-bookworm-slim
    working_dir: /repo
    command: ["node", "tools/dev-stack/push-sink.mjs"]
    environment:
      PUSH_SINK_HOST: "0.0.0.0"
      PUSH_SINK_PORT: "8091"
      PUSH_SINK_PUBLIC_ORIGIN: "http://127.0.0.1:8091"
      # 放 <kid>.pem 进宿主机的 .data/push-sink/apns/，APNs 令牌就会验签。
      PUSH_SINK_APNS_KEY_DIR: /keys/apns
    volumes:
      - ../../tools:/repo/tools:ro
      - ./.data/push-sink:/keys:ro
    ports:
      - "127.0.0.1:8091:8091"
    healthcheck:
      test:
        - CMD
        - node
        - "-e"
        - "fetch('http://127.0.0.1:8091/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  hibp:
    image: node:22.23.3-bookworm-slim
    working_dir: /repo
    command: ["node", "tools/dev-stack/hibp-fixture.mjs"]
    environment:
      HIBP_HOST: "0.0.0.0"
      HIBP_PORT: "8092"
    volumes:
      - ../../tools:/repo/tools:ro
    ports:
      - "127.0.0.1:8092:8092"
    healthcheck:
      test:
        - CMD
        - node
        - "-e"
        - "fetch('http://127.0.0.1:8092/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  armadra-server:
    build:
      context: ../..
      dockerfile: apps/server/docker/Dockerfile
    image: armadra-dev-server:local
    environment:
      ARMADRA_PUBLIC_ORIGIN: "https://localhost:8443"
    volumes:
      - armadra-server:/data
    ports:
      - "127.0.0.1:8443:8443"
    restart: unless-stopped

  # ---- 平台（docs/design/platform/dev-stack-and-verification.md §1）----
  # `platform` / `personal` 是独立 profile：`pnpm platform:up` / `platform:personal` 只起各自
  # 的服务，不连带起上面那组非 profile 服务。云仓镜像缺省取 GHCR 的钉版本；设了
  # ARMADRA_DEV_STACK_CLOUD_SRC（或旁边有 ../armadra-cloud）时叠加
  # docker-compose.cloud-src.yml 改为本地构建。

  platform-postgres:
    image: postgres:17.11-alpine
    profiles: ["platform"]
    environment:
      POSTGRES_USER: armadra
      POSTGRES_PASSWORD: "${PLATFORM_DB_PASSWORD:?run pnpm dev-stack up}"
      POSTGRES_DB: armadra_cloud
    volumes:
      - platform-postgres:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5441:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "armadra", "-d", "armadra_cloud"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  platform-redis:
    image: redis:8.8.3-alpine
    profiles: ["platform"]
    ports:
      - "127.0.0.1:6391:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  cloud:
    image: ghcr.io/owlbay/armadra-cloud:0.1.0
    profiles: ["platform"]
    environment:
      ARMADRA_CLOUD_ISSUER: "http://127.0.0.1:8100"
      ARMADRA_CLOUD_APP_ORIGIN: "http://127.0.0.1:8100"
      ARMADRA_CLOUD_LISTEN: "0.0.0.0:8100"
      ARMADRA_CLOUD_DATABASE_URL: "postgres://armadra:${PLATFORM_DB_PASSWORD:?run pnpm dev-stack up}@platform-postgres:5432/armadra_cloud"
      ARMADRA_CLOUD_REDIS_URL: "redis://platform-redis:6379"
      ARMADRA_CLOUD_MASTER_KEY: "${ARMADRA_CLOUD_MASTER_KEY:?run pnpm dev-stack up}"
      ARMADRA_CLOUD_RELAY_DOMAIN: src.localhost
    ports:
      - "127.0.0.1:8100:8100"
    depends_on:
      platform-postgres:
        condition: service_healthy
      platform-redis:
        condition: service_healthy
    restart: unless-stopped

  relay:
    image: ghcr.io/owlbay/armadra-relay:0.1.0
    profiles: ["platform"]
    command: ["saas", "serve"]
    environment:
      RELAY_LISTEN: "0.0.0.0:8443"
      RELAY_NODE_ID: dev-stack
      RELAY_DOMAIN: src.localhost
      RELAY_CLOUD_ISSUER: "http://cloud:8100"
      RELAY_REDIS_URL: "redis://platform-redis:6379"
      # 本地走 HTTP：地址用 *.src.localhost，浏览器与 Node 都把 *.localhost 解析到回环。
      RELAY_ALLOW_INSECURE_TUNNEL: "1"
    ports:
      - "127.0.0.1:8101:8443"
    depends_on:
      platform-redis:
        condition: service_healthy
    restart: unless-stopped

  # 单人中转：不带数据库，自签 TLS。issuer 与对外地址是宿主机能访问的
  # `https://127.0.0.1:8103`（证书 SAN = 127.0.0.1 + localhost），容器内外同一个端口 8103：
  # 中继只认一个 issuer，所以不用 host.docker.internal 另开一个名字，而是让 NAT 后的 core
  # 与中继共用网络命名空间（见下面的 armadra-server-nat-personal），它连 127.0.0.1:8103
  # 就是连中继自己。自签 CA 的指纹由 dev-stack.mjs 在中继起来后取出来交给 core。
  relay-personal:
    image: ghcr.io/owlbay/armadra-relay:0.1.0
    profiles: ["personal"]
    command:
      - personal
      - serve
      - --host
      - 127.0.0.1
      - --port
      - "8103"
      - --listen
      - "0.0.0.0:8103"
      - --tls
      - "${ARMADRA_DEV_STACK_RELAY_TLS:-self-signed}"
    environment:
      RELAY_DATA_DIR: /data
      RELAY_PERSONAL_ACCOUNT: dev
      RELAY_PERSONAL_PASSWORD_FILE: /run/secrets/personal_relay_password
    secrets:
      - personal_relay_password
    volumes:
      - relay-personal:/data
    ports:
      - "127.0.0.1:8103:8103"
    restart: unless-stopped

  # 模拟在 NAT 后、只能外连的 core：不发布端口，只有同一 compose 网络里的中继 / 探针够得到它。
  armadra-server-nat:
    build:
      context: ../..
      dockerfile: apps/server/docker/Dockerfile
    image: armadra-dev-server:local
    profiles: ["platform"]
    environment:
      ARMADRA_PUBLIC_ORIGIN: "https://armadra-server-nat:8443"
    volumes:
      - armadra-server-nat:/data
    restart: unless-stopped

  # personal 里的 NAT 后 core：与 relay-personal 共用网络命名空间，所以容器内的
  # 127.0.0.1:8103 就是中继，issuer 与宿主机看到的完全一样（断言的签发方、证书 SAN 都对得上）。
  # 仍然不发布端口。入口脚本拿 ARMADRA_CLOUD_ISSUER / REGISTRATION_TOKEN / FINGERPRINT 自动登记；
  # 令牌与指纹由 dev-stack.mjs 在中继起来后取出，只经进程环境传入，不写进仓库。
  armadra-server-nat-personal:
    build:
      context: ../..
      dockerfile: apps/server/docker/Dockerfile
    image: armadra-dev-server:local
    profiles: ["personal"]
    network_mode: "service:relay-personal"
    environment:
      ARMADRA_PUBLIC_ORIGIN: "https://127.0.0.1:8443"
      ARMADRA_CLOUD_ISSUER: "https://127.0.0.1:8103"
      ARMADRA_CLOUD_REGISTRATION_TOKEN: "${ARMADRA_CLOUD_REGISTRATION_TOKEN:-}"
      ARMADRA_CLOUD_FINGERPRINT: "${ARMADRA_CLOUD_FINGERPRINT:-}"
      ARMADRA_CLOUD_LABEL: dev-stack-nat
    volumes:
      - armadra-server-nat-personal:/data
    depends_on:
      relay-personal:
        condition: service_started
    restart: unless-stopped

  headscale:
    image: headscale/headscale:0.29.4
    profiles: ["headscale"]
    command: ["serve"]
    volumes:
      - ./headscale/config.yaml:/etc/headscale/config.yaml:ro
      - headscale:/var/lib/headscale
    ports:
      - "127.0.0.1:8094:8080"
    restart: unless-stopped

  ntfy:
    image: binwiederhier/ntfy:v2.28.0
    profiles: ["ntfy"]
    command: ["serve"]
    environment:
      NTFY_BASE_URL: "http://127.0.0.1:8093"
      NTFY_LISTEN_HTTP: ":8093"
    ports:
      - "127.0.0.1:8093:8093"
    restart: unless-stopped

  # 真回连挑战地址的 Pebble：TLS-ALPN-01 / HTTP-01 打 host.docker.internal 的
  # 5001 / 5002，即宿主回环上的挑战监听（OrbStack / Docker Desktop 转得到；
  # Linux 上宿主回环对容器不通，只做本机演练）。
  pebble-va:
    image: ghcr.io/letsencrypt/pebble:2.10.1
    profiles: ["pebble-va"]
    environment:
      PEBBLE_VA_ALWAYS_VALID: "0"
      PEBBLE_VA_NOSLEEP: "1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:14100:14000"
      - "127.0.0.1:15100:15000"
    restart: unless-stopped

  # 反向代理演练（部署指南 §3.3）：Caddyfile 与 server-e2e --proxy=caddy 是同一份。
  # 上游的 CA 先取到 .data/caddy/upstream.crt（指南里的 curl -k …/ca.crt）。
  caddy:
    image: caddy:2.10.2-alpine
    profiles: ["caddy"]
    environment:
      ARMADRA_CADDY_SITE: "localhost:8444"
      ARMADRA_CADDY_UPSTREAM: "https://host.docker.internal:8445"
      ARMADRA_CADDY_SERVER_NAME: "localhost"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./.data/caddy:/etc/caddy/upstream:ro
    ports:
      - "127.0.0.1:8444:8444"
    restart: unless-stopped

  # S3 兼容桶（更新镜像 W-MIRROR 的替身，外部服务 §3.3）：versitygw 的 posix 后端，
  # 桶就是 /data 下的目录。只认 services.mjs 里那对回环用的固定访问键。
  s3:
    image: versity/versitygw:v1.0.17
    profiles: ["s3"]
    command:
      - --access
      - armadra-dev
      - --secret
      - armadra-dev-mirror
      - --port
      - ":8095"
      - posix
      - /data
    volumes:
      - s3:/data
    ports:
      - "127.0.0.1:8095:8095"
    restart: unless-stopped

volumes:
  step-ca:
  gitea:
  glitchtip-postgres:
  armadra-server:
  headscale:
  s3:
  platform-postgres:
  relay-personal:
  armadra-server-nat:
  armadra-server-nat-personal:

secrets:
  personal_relay_password:
    environment: PERSONAL_RELAY_PASSWORD
