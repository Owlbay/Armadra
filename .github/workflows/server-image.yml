# 服务器壳镜像发布到 GHCR（补全计划 G3-5，docs/guides/server-deployment.md）。
#
# 只在推 v* 标签时推送：ghcr.io/owlbay/armadra-server:<版本> 与 :latest（镜像名必须小写），
# linux/amd64 + linux/arm64。凭据是工作流自带的 GITHUB_TOKEN（packages: write
# 只给 publish 作业），不需要任何仓库外的密钥。拉取请求不触发本工作流；手动
# 触发只构建、不推送（夜间的 server-image 作业另外跑容器端到端）。
name: server-image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: 镜像名与标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/owlbay/armadra-server
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=sha,enable=${{ !startsWith(github.ref, 'refs/tags/v') }}

      - name: 登录 GHCR（只在标签上）
        if: ${{ startsWith(github.ref, 'refs/tags/v') }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建（标签上推送）
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
