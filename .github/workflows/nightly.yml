# B 档夜间作业（docs/guides/ci-release.md §1.1）：打包冒烟、update-e2e、
# Capacitor 构建等需要打包或较慢的探针。清单是 tools/ci/e2e.json 里 tier b 的
# 条目；具体作业由 G3-4 填。失败开 issue，不阻断合并。
name: nightly

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PNPM_VERSION: "11.18.0"
  NODE_VERSION: "22"

jobs:
  e2e-b:
    name: e2e (tier b)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 骨架：B 档条目还没有时只列出清单；G3-4 换成构建、打包与真正的运行。
      - name: B 档清单
        run: node tools/ci/e2e.mjs --tier b --list

  # 手机壳（补全计划 G3-1）：原生层单测、不签名的模拟器 / debug 构建，再在模拟器里
  # 跑「连接 → 配对 → 画布」（tools/probes/mobile-shell-e2e.mjs）。产物名见
  # tools/release/artifacts.mjs 的 mobileAssets；真机、签名与商店上传要用户的证书。
  mobile-ios:
    name: mobile (ios simulator)
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: 构建页面、core 与手机壳的 www
        shell: bash
        run: |
          set -euo pipefail
          pnpm libs:build
          pnpm --filter @armadra/web build
          pnpm --filter @armadra/desktop build
          pnpm --filter @armadra/mobile sync
      - name: ArmadraNativeKit 单测（钉扎判定、推送解密、深链）
        run: swift test --package-path apps/mobile/ios/ArmadraNativeKit
      # 「Sign to Run Locally」：不要证书，但模拟器只在有 application-identifier
      # 时才给钥匙串（CODE_SIGNING_ALLOWED=NO 的包存不进会话）。
      - name: 模拟器构建（本地签名，不要证书）
        shell: bash
        run: |
          set -euo pipefail
          version=$(node -p "require('./apps/mobile/package.json').version")
          xcodebuild build -project apps/mobile/ios/App/App.xcodeproj -scheme App \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath target/mobile/ios MARKETING_VERSION="$version"
          name=$(node --input-type=module -e "import { mobileAssets } from './tools/release/artifacts.mjs'; console.log(mobileAssets('$version')[1].name)")
          ditto -c -k --keepParent \
            target/mobile/ios/Build/Products/Debug-iphonesimulator/App.app \
            "target/mobile/$name"
      - name: 连接 → 配对 → 画布（XCUITest）
        run: node tools/probes/mobile-shell-e2e.mjs --platform ios target/mobile-shell-e2e/ios
      - name: 上传产物
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: mobile-ios
          path: |
            target/mobile/*.zip
            target/mobile-shell-e2e/ios/result.json
            target/mobile-shell-e2e/ios/*.log
            target/mobile-shell-e2e/ios/*.xcresult
          if-no-files-found: warn

  mobile-android:
    name: mobile (android emulator)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: pnpm install --frozen-lockfile
      - name: 构建页面、core 与手机壳的 www
        shell: bash
        run: |
          set -euo pipefail
          pnpm libs:build
          pnpm --filter @armadra/web build
          pnpm --filter @armadra/desktop build
          node apps/desktop/scripts/ensure-node-pty.mjs
          pnpm --filter @armadra/mobile sync
      - name: armadra-native-core 单测（钉扎判定、推送解密、深链）与 debug APK
        shell: bash
        working-directory: apps/mobile/android
        run: |
          set -euo pipefail
          ./gradlew :armadra-native-core:test :app:assembleDebug --no-daemon --stacktrace
          version=$(node -p "require('../package.json').version")
          name=$(node --input-type=module -e "import { mobileAssets } from '../../../tools/release/artifacts.mjs'; console.log(mobileAssets('$version')[0].name)")
          mkdir -p ../../../target/mobile
          cp app/build/outputs/apk/debug/app-debug.apk "../../../target/mobile/$name"
      # 模拟器要 KVM：在一次性的 runner 上放开 /dev/kvm。
      - name: 放开 KVM
        shell: bash
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: 连接 → 配对 → 画布（插桩用例）
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: node tools/probes/mobile-shell-e2e.mjs --platform android target/mobile-shell-e2e/android
      - name: 上传产物
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: mobile-android
          path: |
            target/mobile/*.apk
            target/mobile-shell-e2e/android/result.json
            target/mobile-shell-e2e/android/*.log
            apps/mobile/android/armadra-native-core/build/reports/tests/
          if-no-files-found: warn

  # 服务器壳镜像（补全计划 G3-5）：按 apps/server/docker/Dockerfile 构建，起容器
  # 只发布到回环，对着它跑容器模式的 server-e2e（配对、邀请、共享画布、撤销）。
  # 只构建、不推送任何镜像仓库；发布到 GHCR 只在打标签时由 server-image.yml 做。
  server-image:
    name: server image (build + container e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 装 xvfb 与中文字体，放开用户命名空间
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb fonts-noto-cjk
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 容器模式 server-e2e
        shell: bash
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          xvfb-run -a node tools/probes/server-e2e.mjs \
            --container=armadra-server:nightly --build target/e2e/server-container

      - name: 上传端到端产物
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-server-container
          path: target/e2e/server-container
          if-no-files-found: ignore
          retention-days: 14
