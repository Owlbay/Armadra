# B 档夜间作业（docs/guides/ci-release.md §1.1）：打包冒烟、update-e2e、
# Capacitor 构建等需要打包或较慢的探针。清单是 tools/ci/e2e.json 里 tier b 的
# 条目；具体作业由 G3-4 填。失败开 issue，不阻断合并。
name: nightly

on:
  schedule:
    - cron: "17 18 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  PNPM_VERSION: "11.18.0"
  NODE_VERSION: "22"

jobs:
  e2e-b:
    name: e2e (tier b)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 骨架：B 档条目还没有时只列出清单；G3-4 换成构建、打包与真正的运行。
      - name: B 档清单
        run: node tools/ci/e2e.mjs --tier b --list

  # 服务器壳镜像（补全计划 G3-5）：按 apps/server/docker/Dockerfile 构建，起容器
  # 只发布到回环，对着它跑容器模式的 server-e2e（配对、邀请、共享画布、撤销）。
  # 只构建、不推送任何镜像仓库；发布到 GHCR 只在打标签时由 server-image.yml 做。
  server-image:
    name: server image (build + container e2e)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: 装 xvfb 与中文字体，放开用户命名空间
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb fonts-noto-cjk
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - uses: browser-actions/setup-chrome@v2
        id: chrome
        with:
          chrome-version: stable

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: 容器模式 server-e2e
        shell: bash
        env:
          CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          xvfb-run -a node tools/probes/server-e2e.mjs \
            --container=armadra-server:nightly --build target/e2e/server-container

      - name: 上传端到端产物
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: e2e-server-container
          path: target/e2e/server-container
          if-no-files-found: ignore
          retention-days: 14

  # Windows 打包验收（补全计划 G3-2）：在 windows runner 上打 NSIS 安装包，用
  # tools/probes/windows-acceptance.mjs 走一遍真机清单——静默安装、会话宿主与命名
  # 管道、三种 shell 里的画布启动器与凭据兑换、Gateway、文件监听、保活（缩到两
  # 分钟）、杀主进程后接回、ConPTY 关闭、静默卸载、用户配置未动。真机上的长时间
  # 保活与真 CLI 仍要用户跑（docs/guides/development.md「Windows 真机验收」）。
  windows-acceptance:
    name: windows acceptance (NSIS + session host)
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      # 与 release.yml 同一个理由：实时扫描会占住刚写出的二进制，打包时撞 EBUSY。
      - name: 让扫描器放过打包目录
        shell: pwsh
        run: |
          $desktop = Join-Path $env:GITHUB_WORKSPACE 'apps\desktop'
          Add-MpPreference -ExclusionPath (Join-Path $desktop 'out')
          Add-MpPreference -ExclusionPath (Join-Path $desktop 'release')
          try {
            Set-MpPreference -DisableRealtimeMonitoring $true
          } catch {
            Write-Host "::warning::无法关闭实时监控：$($_.Exception.Message)"
          }

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: 打 Windows 安装包（本地构建，不签名）
        shell: bash
        run: |
          set -euo pipefail
          pnpm libs:build
          pnpm --filter @armadra/desktop dist

      - name: 真机验收清单（runner 版）
        shell: bash
        run: |
          set -euo pipefail
          installer=$(ls apps/desktop/release/Armadra-Setup-*-x64.exe | head -n 1)
          node tools/probes/windows-acceptance.mjs --installer "$installer" \
            --soak-minutes 2 --out target/windows-acceptance

      - name: 上传验收结果
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: windows-acceptance
          path: target/windows-acceptance
          if-no-files-found: ignore
          retention-days: 14
