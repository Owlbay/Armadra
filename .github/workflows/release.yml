# 发布流水线，见 docs/design/updates-and-service-install.md §1 与
# docs/guides/ci-release.md。
# 五个作业：verify 拦住版本与标签不一致的发布，build 按目标矩阵打包并把打包器
# 的产物改名成发布用的名字，web 打服务器壳要托管的前端产物，assemble 汇总校验
# 清单与签名并只创建 draft Release，notarize 在缺少 secret 时跳过并在说明里标注。
# 发布是人的动作：本工作流永远不会把 Release 从 draft 转正。
name: release

on:
  push:
    tags: ["v*"]
  # 手动触发有两种用法：给 tag 就是补发那个标签（照样要求三处版本与它一致），
  # 不给就是在当前分支上演练。dry_run 为真时不创建任何 Release。
  workflow_dispatch:
    inputs:
      tag:
        description: 要发布的标签，例如 v0.1.0；留空则在当前分支上演练
        type: string
        default: ""
      dry_run:
        description: 只构建与校验，不创建 draft Release
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PNPM_VERSION: "11.18.0"
  NODE_VERSION: "22"
  ARMADRA_RELEASE_CHANNEL: stable

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      # 手动补发一个标签时要构建那个标签的树，而不是触发分支的 HEAD。
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}
      # core 的 Git 操作（merge / cherry-pick / amend）用仓库或全局配置里的
      # 身份提交；runner 两者都没有，Git 会在动树之前拒绝，测试就把它记成
      # unknownOutcome。开发机上是全局配置在兜底，这里也放一份全局配置——
      # 不用环境变量，因为 GIT_AUTHOR_* 会压过测试夹具自己 `-c user.name` 写的作者。
      - name: 给 Git 一个身份
        shell: bash
        run: |
          set -euo pipefail
          git config --global user.name "Armadra CI"
          git config --global user.email "ci@armadra.invalid"
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 版本住在仓库里（根 package.json 是源，两种壳与它一致），标签只是指向它
      # 的名字。所以这里不是从标签解出版本，而是要求标签等于版本；不等就拒绝，
      # 因为发的包会自报仓库里的那个版本，而更新检查比的正是版本。
      - name: 三处版本与标签一致，兼容范围包含本版本
        id: version
        shell: bash
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          version="$(node tools/release/version.mjs print)"
          tag="${INPUT_TAG:-}"
          if [ -z "$tag" ] && [ "$REF_TYPE" = "tag" ]; then
            tag="$REF_NAME"
          fi
          # 分支上的演练没有标签可比，用仓库版本推出来的那个名字占位，
          # 后面的产物命名与 latest.json 才有一致的下载地址可写。
          [ -n "$tag" ] || tag="v$version"
          node tools/release/version.mjs check --tag "$tag"
          {
            printf 'version=%s\n' "$version"
            printf 'tag=%s\n' "$tag"
          } >> "$GITHUB_OUTPUT"
          # 预发布由标签里的 "-" 判定（v0.2.0-rc.1），与 semver 的读法一致。
          case "$tag" in
            *-*) printf 'prerelease=true\n' >> "$GITHUB_OUTPUT" ;;
            *) printf 'prerelease=false\n' >> "$GITHUB_OUTPUT" ;;
          esac
          # 只有真的有标签、且不是演练，才会创建 Release。
          if [ "$REF_TYPE" = "tag" ] || [ -n "$INPUT_TAG" ]; then
            if [ "$DRY_RUN" = "true" ]; then
              printf 'publish=false\n' >> "$GITHUB_OUTPUT"
            else
              printf 'publish=true\n' >> "$GITHUB_OUTPUT"
            fi
          else
            printf 'publish=false\n' >> "$GITHUB_OUTPUT"
          fi
      - run: node tools/ci/validate-workflows.mjs
      - run: node --test tools/release/*.test.mjs
      - run: pnpm libs:build
      - run: pnpm check
      - run: pnpm test

  web:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm libs:build
      - run: pnpm --filter @armadra/web build
      - name: 打包前端产物
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          tar --numeric-owner -czf "artifacts/armadra-web_${{ needs.verify.outputs.version }}.tar.gz" \
            -C apps/web/dist .
      - uses: actions/upload-artifact@v4
        with:
          name: release-web
          path: artifacts
          if-no-files-found: error

  build:
    needs: verify
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            target: darwin-aarch64
          - runner: macos-15-intel
            target: darwin-x86_64
          # glibc 的符号版本是单向的：在 24.04（glibc 2.39）上链接出来的二进制
          # 会记下 GLIBC_2.38/2.39，到 22.04 上动态链接器直接拒绝启动，而构建
          # 本身一切正常。LiveAgent 就是这样发出去过一个版本（#714），修法是把
          # Linux 行钉在 22.04 并在产物上断言基线。
          # 这两个 runner 与 Ubuntu 22.04 LTS 的标准支持同在 2027-04 退役，
          # 届时换成 ubuntu:22.04 容器构建。
          - runner: ubuntu-22.04
            target: linux-x86_64
          # arm64 的 Linux/Windows runner 只对公开仓库免费；仓库转私有时这两行
          # 要换成自托管 runner 或删掉，对应目标也就不再发布。
          - runner: ubuntu-22.04-arm
            target: linux-aarch64
          - runner: windows-2022
            target: windows-x86_64
          - runner: windows-11-arm
            target: windows-aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      # electron-builder 自带 Chromium，不链接 WebKitGTK；Linux 侧只差 .rpm
      # 的 rpmbuild 与 AppImage 用到的 file。缺任何一个都是打到一半才报错。
      - name: 安装 Linux 打包依赖
        if: startsWith(matrix.target, 'linux-')
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y file rpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm libs:build

      # 证书先自己导进一个临时钥匙串并当场 find-identity：证书或口令不对时
      # 这一步十秒内就红，交给打包器则要等整个构建跑完。导完之后把同一份
      # base64 交给 electron-builder 的 CSC_LINK / CSC_KEY_PASSWORD——它认的是
      # 这两个变量，钥匙串只是让失败提前发生的预检。
      - name: 导入 Apple 证书到临时钥匙串
        if: startsWith(matrix.target, 'darwin-')
        shell: bash
        env:
          APPLE_CERTIFICATE_P12_BASE64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 || secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          if [ -z "${APPLE_CERTIFICATE_P12_BASE64:-}" ] && [ -z "${APPLE_CERTIFICATE_PASSWORD:-}" ]; then
            echo "::warning::没有 APPLE_CERTIFICATE_P12_BASE64 与 APPLE_CERTIFICATE_PASSWORD，macOS 产物不签名，首次打开会有 Gatekeeper 提示"
            exit 0
          fi
          # 只给了一半是配置错误，不是「不签名」：在这里失败，而不是发一个悄悄没签的包。
          if [ -z "${APPLE_CERTIFICATE_P12_BASE64:-}" ] || [ -z "${APPLE_CERTIFICATE_PASSWORD:-}" ]; then
            echo "::error::APPLE_CERTIFICATE_P12_BASE64 与 APPLE_CERTIFICATE_PASSWORD 要一起给"
            exit 1
          fi
          keychain="$RUNNER_TEMP/armadra-release.keychain-db"
          keychain_password="$(openssl rand -hex 24)"
          certificate="$RUNNER_TEMP/developer-id-application.p12"
          printf '%s' "$APPLE_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          # 锁定超时比最长的一次构建还长；钥匙串锁上就再也签不动了。
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          # 没有这一行，codesign 会弹一个没人能点的「允许访问」对话框并超时。
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security default-keychain -s "$keychain"
          rm -f "$certificate"
          security find-identity -v -p codesigning "$keychain"
          identity="${SIGNING_IDENTITY:-}"
          if [ -z "$identity" ]; then
            identity="$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(.*\)".*/\1/p' | head -1)"
          fi
          if [ -z "$identity" ]; then
            echo "::error::钥匙串里没有可用于 codesign 的身份"
            exit 1
          fi
          # electron-builder 自己再导一次同一份证书（signing-electron.mjs 的
          # CERT_ENV / CERT_PASSWORD_ENV），所以这里把它原样传下去。
          {
            printf 'CSC_LINK=%s\n' "$APPLE_CERTIFICATE_P12_BASE64"
            printf 'CSC_KEY_PASSWORD=%s\n' "$APPLE_CERTIFICATE_PASSWORD"
            printf 'CSC_NAME=%s\n' "$identity"
          } >> "$GITHUB_ENV"

      # store-credentials --validate 会真的去问一次 Apple。凭据不对时它在这里
      # 报错，而不是在打包最后一步排队等公证时。两套凭据（外部服务 §2.1）：
      # App Store Connect API key 优先（.p8 解到 $RUNNER_TEMP/AuthKey.p8），
      # Apple ID + app 专用密码作回退。app-builder-lib 只要看到 APPLE_ID 就走
      # Apple ID 分支，所以只把选中的那一套写进环境。一套给了一半是配置错误，
      # 在这里就失败；两套都没有才是「不公证」，告警后继续。
      - name: 预检公证凭据
        if: startsWith(matrix.target, 'darwin-')
        shell: bash
        env:
          NOTARY_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          NOTARY_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          NOTARY_API_ISSUER: ${{ secrets.APPLE_API_ISSUER_ID }}
          NOTARY_APPLE_ID: ${{ secrets.APPLE_ID }}
          NOTARY_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD || secrets.APPLE_PASSWORD }}
        run: |
          set -euo pipefail
          count() { local n=0; for value in "$@"; do [ -n "$value" ] && n=$((n + 1)); done; echo "$n"; }
          api="$(count "${NOTARY_API_KEY_P8_BASE64:-}" "${NOTARY_API_KEY_ID:-}" "${NOTARY_API_ISSUER:-}")"
          appleid="$(count "${NOTARY_APPLE_ID:-}" "${NOTARY_TEAM_ID:-}" "${NOTARY_PASSWORD:-}")"
          if [ "$api" = 3 ]; then
            key="$RUNNER_TEMP/AuthKey.p8"
            printf '%s' "$NOTARY_API_KEY_P8_BASE64" | base64 --decode > "$key"
            chmod 600 "$key"
            xcrun notarytool store-credentials armadra-notary \
              --key "$key" \
              --key-id "$NOTARY_API_KEY_ID" \
              --issuer "$NOTARY_API_ISSUER" \
              --validate
            # electron-builder 认这三个变量（signing-electron.mjs 的
            # APPLE_API_KEY_ENV / APPLE_API_KEY_ID_ENV / APPLE_API_ISSUER_ENV）；
            # APPLE_API_KEY 是 .p8 的路径，不是内容。
            {
              printf 'APPLE_API_KEY=%s\n' "$key"
              printf 'APPLE_API_KEY_ID=%s\n' "$NOTARY_API_KEY_ID"
              printf 'APPLE_API_ISSUER=%s\n' "$NOTARY_API_ISSUER"
            } >> "$GITHUB_ENV"
            [ "$appleid" = 0 ] || echo "::notice::App Store Connect API key 与 Apple ID 都配了，公证用 API key"
            exit 0
          fi
          if [ "$api" != 0 ] && [ "$appleid" != 3 ]; then
            echo "::error::APPLE_API_KEY_P8_BASE64 / APPLE_API_KEY_ID / APPLE_API_ISSUER_ID 只配了 $api 个，三个要一起给"
            exit 1
          fi
          if [ "$appleid" = 3 ]; then
            xcrun notarytool store-credentials armadra-notary \
              --apple-id "$NOTARY_APPLE_ID" \
              --team-id "$NOTARY_TEAM_ID" \
              --password "$NOTARY_PASSWORD" \
              --validate
            # electron-builder 认这三个变量（signing-electron.mjs 的
            # APPLE_ID_ENV / APPLE_PASSWORD_ENV / APPLE_TEAM_ENV），公证与装订
            # 由它在打包末尾做。
            {
              printf 'APPLE_ID=%s\n' "$NOTARY_APPLE_ID"
              printf 'APPLE_TEAM_ID=%s\n' "$NOTARY_TEAM_ID"
              printf 'APPLE_APP_SPECIFIC_PASSWORD=%s\n' "$NOTARY_PASSWORD"
            } >> "$GITHUB_ENV"
            exit 0
          fi
          if [ "$appleid" != 0 ]; then
            echo "::error::APPLE_ID / APPLE_TEAM_ID / APPLE_APP_SPECIFIC_PASSWORD 只配了 $appleid 个，三个要一起给"
            exit 1
          fi
          echo "::warning::没有 App Store Connect API key（APPLE_API_KEY_P8_BASE64 / APPLE_API_KEY_ID / APPLE_API_ISSUER_ID），也没有 Apple ID 三件套，macOS 产物不公证"

      # Windows 的 Authenticode 三条路，只能配一条（外部服务 §2.2，
      # signing-electron.mjs 的 windowsPlan）：
      #   - Azure Artifact Signing：secrets AZURE_TENANT_ID / AZURE_CLIENT_ID /
      #     AZURE_CLIENT_SECRET + 变量 AZURE_SIGNING_ENDPOINT / AZURE_SIGNING_ACCOUNT /
      #     AZURE_SIGNING_PROFILE / ARMADRA_WIN_PUBLISHER_NAME，齐全才合并
      #     win.azureSignOptions；
      #   - OV 证书文件：WINDOWS_CERT_BASE64 / WINDOWS_CERT_PASSWORD → CSC_LINK /
      #     CSC_KEY_PASSWORD；
      #   - 自托管 runner 上的 USB 令牌：变量 ARMADRA_WIN_CERT_SHA1（Windows 两行
      #     的 runs-on 要改成 [self-hosted, windows, signing]，见 ci-release.md §3）。
      # 给了一半就在这里失败；都没有才是「不签名」，告警后继续。
      - name: 选 Windows 签名路径
        if: startsWith(matrix.target, 'windows-')
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          PUBLISHER_NAME: ${{ vars.ARMADRA_WIN_PUBLISHER_NAME }}
          CERT_SHA1: ${{ vars.ARMADRA_WIN_CERT_SHA1 }}
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          azure=(AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_SIGNING_ENDPOINT AZURE_SIGNING_ACCOUNT AZURE_SIGNING_PROFILE)
          set_count=0
          missing=()
          for name in "${azure[@]}"; do
            if [ -n "${!name:-}" ]; then set_count=$((set_count + 1)); else missing+=("$name"); fi
          done
          [ -n "${PUBLISHER_NAME:-}" ] || missing+=("ARMADRA_WIN_PUBLISHER_NAME")
          if [ "$set_count" -gt 0 ]; then
            if [ ${#missing[@]} -gt 0 ]; then
              echo "::error::Azure Artifact Signing 只配了一半，缺：${missing[*]}"
              exit 1
            fi
            if [ -n "${WINDOWS_CERT_BASE64:-}" ] || [ -n "${CERT_SHA1:-}" ]; then
              echo "::error::Azure Artifact Signing 与 WINDOWS_CERT_BASE64 / ARMADRA_WIN_CERT_SHA1 同时配置，只能选一条"
              exit 1
            fi
            {
              for name in "${azure[@]}"; do printf '%s=%s\n' "$name" "${!name}"; done
              printf 'ARMADRA_WIN_PUBLISHER_NAME=%s\n' "$PUBLISHER_NAME"
            } >> "$GITHUB_ENV"
            echo "Windows：Azure Artifact Signing（$AZURE_SIGNING_ACCOUNT / $AZURE_SIGNING_PROFILE）"
            exit 0
          fi
          if [ -n "${WINDOWS_CERT_BASE64:-}" ] && [ -n "${CERT_SHA1:-}" ]; then
            echo "::error::WINDOWS_CERT_BASE64 与 ARMADRA_WIN_CERT_SHA1 同时配置，只能选一条"
            exit 1
          fi
          if [ -n "${WINDOWS_CERT_BASE64:-}" ]; then
            if [ -z "${WINDOWS_CERT_PASSWORD:-}" ]; then
              echo "::error::有 WINDOWS_CERT_BASE64 但没有 WINDOWS_CERT_PASSWORD"
              exit 1
            fi
            {
              printf 'CSC_LINK=%s\n' "$WINDOWS_CERT_BASE64"
              printf 'CSC_KEY_PASSWORD=%s\n' "$WINDOWS_CERT_PASSWORD"
              [ -z "${PUBLISHER_NAME:-}" ] || printf 'ARMADRA_WIN_PUBLISHER_NAME=%s\n' "$PUBLISHER_NAME"
            } >> "$GITHUB_ENV"
            echo "Windows：证书文件（CSC_LINK）"
            exit 0
          fi
          if [ -n "${CERT_SHA1:-}" ]; then
            {
              printf 'ARMADRA_WIN_CERT_SHA1=%s\n' "$CERT_SHA1"
              [ -z "${PUBLISHER_NAME:-}" ] || printf 'ARMADRA_WIN_PUBLISHER_NAME=%s\n' "$PUBLISHER_NAME"
            } >> "$GITHUB_ENV"
            echo "Windows：本 runner 证书库里的 $CERT_SHA1"
            exit 0
          fi
          echo "::warning::没有配置任何 Windows 签名路径，安装包不签名：SmartScreen 会提示、Smart App Control 直接拦，装好的副本也不会自动更新"

      # 证书文件那条路：证书主体的 CN 必须就是钉住的 publisherName。装好的副本
      # 每次更新都拿安装包证书的 CN 与它比，对不上就拒装——换证书时最容易踩。
      - name: 核对 Windows 证书主体与 publisherName
        if: startsWith(matrix.target, 'windows-')
        shell: pwsh
        env:
          WINDOWS_CERT_BASE64: ${{ secrets.WINDOWS_CERT_BASE64 }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERT_BASE64 -or -not $env:ARMADRA_WIN_PUBLISHER_NAME) {
            Write-Host "没有证书文件或没有钉 publisherName，跳过"
            exit 0
          }
          $bytes = [Convert]::FromBase64String($env:WINDOWS_CERT_BASE64)
          $cert = [System.Security.Cryptography.X509Certificates.X509Certificate2]::new($bytes, $env:WINDOWS_CERT_PASSWORD)
          $subject = $cert.GetNameInfo([System.Security.Cryptography.X509Certificates.X509NameType]::SimpleName, $false)
          node apps/desktop/scripts/signing-electron.mjs check-publisher --subject "$subject"
          exit $LASTEXITCODE

      # Windows runner 的实时扫描会把刚写出的文件占住几秒到几十秒，复制到包里
      # 时就撞上 EBUSY。把产物目录排除出扫描范围，比只在复制处重试可靠；runner
      # 是一次性的，排除项随之作废。
      - name: 让扫描器放过打包目录
        if: startsWith(matrix.target, 'windows-')
        shell: pwsh
        run: |
          $desktop = Join-Path $env:GITHUB_WORKSPACE 'apps\desktop'
          Add-MpPreference -ExclusionPath (Join-Path $desktop 'out')
          Add-MpPreference -ExclusionPath (Join-Path $desktop 'release')
          # 路径排除过后 EBUSY 仍然出现在另一个二进制上，所以把实时监控整个
          # 关掉；篡改保护拦下时只记一句，不让这一步失败。
          try {
            Set-MpPreference -DisableRealtimeMonitoring $true
            Write-Host "实时监控已关闭"
          } catch {
            Write-Host "::warning::无法关闭实时监控：$($_.Exception.Message)"
          }

      # scripts/dist.mjs 两步：先由 signing-electron.mjs 定签名计划（sign /
      # skip / refuse）并当场报告，再 electron-vite build 之后调用
      # electron-builder；包里要带的东西由 after-pack.mjs 从 out/ 与
      # src/core/db/migrations 放进去。更新地址由 ARMADRA_UPDATER_ENDPOINTS 注入，
      # 仓库里的 publish.url 始终是占位，免得本地构建也去联系发布来源。
      # 每平台的 target 列表来自 electron-builder.yml，与
      # tools/release/artifacts.mjs 的 desktopAssets() 一一对应
      # （apps/desktop/scripts/artifact-targets.test.mjs 钉住这条对应）。
      - name: 打桌面包
        shell: bash
        env:
          ARMADRA_UPDATER_ENDPOINTS: https://github.com/${{ github.repository }}/releases/latest/download/latest.json
          # 发布包不带本地构建的停更标记（scripts/dist.mjs 的 RELEASE_ENV）。
          ARMADRA_DIST_RELEASE: "1"
        run: pnpm --filter @armadra/desktop dist

      # 「有 _CodeSignature」不等于「Gatekeeper 认」：签过名的 .app 上传前先过
      # codesign --verify --deep --strict（外部服务 §2.1 第 3 条）。没签名就没什么可验。
      - name: 校验 macOS 签名
        if: startsWith(matrix.target, 'darwin-')
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CSC_LINK:-}" ]; then
            echo "未签名构建，跳过 codesign --verify"
            exit 0
          fi
          node apps/desktop/scripts/signing-electron.mjs verify-mac --dir apps/desktop/release

      # Windows 签过名的安装包与包里的 armadra.exe 都必须是 Authenticode Valid。
      - name: 校验 Windows 签名
        if: startsWith(matrix.target, 'windows-')
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CSC_LINK:-}" ] && [ -z "${AZURE_CLIENT_ID:-}" ] && [ -z "${ARMADRA_WIN_CERT_SHA1:-}" ]; then
            echo "未签名构建，跳过 Authenticode 校验"
            exit 0
          fi
          node apps/desktop/scripts/signing-electron.mjs verify-windows --dir apps/desktop/release

      # 产物已经落地，先断言它能在承诺的系统上启动，再去改名上传。
      - name: 校验 Linux 的 glibc 基线
        if: startsWith(matrix.target, 'linux-')
        shell: bash
        run: bash tools/release/verify-linux-glibc-baseline.sh

      # 打包器的名字（Armadra-0.1.0-arm64.dmg、Armadra Setup 0.1.0.exe）里读不出
      # 更新检查认得的目标，所以这里统一改名。--require-updater：发布必须产出那个
      # 能原地更新的包，缺了就在这里失败而不是发一个永远收不到更新的版本。
      - name: 收集并改名桌面产物
        shell: bash
        run: |
          set -euo pipefail
          node tools/release/stage-desktop.mjs \
            --target "${{ matrix.target }}" \
            --from apps/desktop/release \
            --out artifacts \
            --version "${{ needs.verify.outputs.version }}" \
            --require-updater

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: artifacts
          if-no-files-found: error

      # 临时钥匙串里有 Developer ID 私钥。runner 是一次性的，但删掉它是一行。
      - name: 清掉临时钥匙串
        if: always() && startsWith(matrix.target, 'darwin-')
        shell: bash
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/armadra-release.keychain-db"
          [ -f "$keychain" ] || exit 0
          security default-keychain -s login.keychain-db || true
          security delete-keychain "$keychain" || true

  # 公证与 Authenticode 都由 build 作业里的 electron-builder 完成；本作业只报告哪些目标缺
  # 少 secret，assemble 会把结论写进 Release 说明顶部。缺 secret 不阻断发布。
  notarize:
    needs: [verify, build]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      unnotarized: ${{ steps.report.outputs.unnotarized }}
    steps:
      - id: report
        shell: bash
        env:
          HAS_APPLE_CERT: ${{ (secrets.APPLE_CERTIFICATE_P12_BASE64 || secrets.APPLE_CERTIFICATE) != '' }}
          HAS_APPLE_NOTARY: ${{ (secrets.APPLE_API_KEY_P8_BASE64 != '' && secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER_ID != '') || (secrets.APPLE_ID != '' && (secrets.APPLE_APP_SPECIFIC_PASSWORD || secrets.APPLE_PASSWORD) != '') }}
          HAS_WINDOWS: ${{ secrets.WINDOWS_CERT_BASE64 != '' || secrets.AZURE_CLIENT_SECRET != '' || vars.ARMADRA_WIN_CERT_SHA1 != '' }}
          HAS_LINUX_GPG: ${{ secrets.ARMADRA_LINUX_GPG_KEY != '' }}
        run: |
          set -euo pipefail
          missing=()
          if [ "$HAS_APPLE_CERT" != "true" ] || [ "$HAS_APPLE_NOTARY" != "true" ]; then
            missing+=("macOS")
          fi
          [ "$HAS_WINDOWS" = "true" ] || missing+=("Windows")
          [ "$HAS_LINUX_GPG" = "true" ] || missing+=("Linux (GPG)")
          printf 'unnotarized=%s\n' "$(IFS=,; echo "${missing[*]:-}")" >> "$GITHUB_OUTPUT"
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::warning::未公证/未签名的平台：${missing[*]}；首次安装会有系统提示"
          fi

  assemble:
    needs: [verify, build, web, notarize]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.sha }}
          # generate-notes 要能看到上一个标签，浅克隆里没有。
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          merge-multiple: true
          path: artifacts
      # 变更清单交给 GitHub 自己生成：它按两个标签之间合并的 PR 写，比任何我们
      # 自己维护的清单都更接近真实发生的事。标签还不存在时（分支演练）它会失败，
      # 那就退回一行标题，说明照样有兼容性围栏。
      - name: 取 GitHub 生成的变更说明
        id: notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
        run: |
          set -euo pipefail
          path="$RUNNER_TEMP/generated-notes.md"
          if ! gh api "repos/$GH_REPO/releases/generate-notes" \
            -f tag_name="$RELEASE_TAG" --jq ".body" > "$path" 2>/dev/null; then
            printf 'Armadra %s\n' "$RELEASE_TAG" > "$path"
          fi
          [ -s "$path" ] || printf 'Armadra %s\n' "$RELEASE_TAG" > "$path"
          printf 'path=%s\n' "$path" >> "$GITHUB_OUTPUT"
      # Linux 包的 GPG 签名（外部服务 §2.3）：rpm 先 rpmsign --addsign 改写包，
      # 再给 AppImage / deb / rpm 各出 .asc，并导出公钥 armadra-linux.gpg 作
      # Release 资产。必须在 assemble.mjs 之前：校验和与 minisign 签的是最终字节。
      # 仓库里已有 apps/web/public/armadra-linux.gpg 时，签名密钥的指纹必须与它
      # 一致。没有 ARMADRA_LINUX_GPG_KEY 就跳过并告警。
      - name: GPG 签 Linux 包
        shell: bash
        env:
          ARMADRA_LINUX_GPG_KEY: ${{ secrets.ARMADRA_LINUX_GPG_KEY }}
          ARMADRA_LINUX_GPG_PASSPHRASE: ${{ secrets.ARMADRA_LINUX_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [ -z "${ARMADRA_LINUX_GPG_KEY:-}" ]; then
            echo "::warning::没有 ARMADRA_LINUX_GPG_KEY，Linux 包不带 .asc，rpm 不签名"
            exit 0
          fi
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y rpm
          node tools/release/sign-gpg.mjs sign --dir artifacts --published apps/web/public/armadra-linux.gpg
          node tools/release/sign-gpg.mjs verify --dir artifacts --public-key artifacts/armadra-linux.gpg
      - name: 生成清单、校验列表与说明
        shell: bash
        env:
          ARMADRA_RELEASE_SIGNING_KEY: ${{ secrets.ARMADRA_RELEASE_SIGNING_KEY }}
        run: |
          set -euo pipefail
          node tools/release/assemble.mjs \
            --dir artifacts \
            --version "${{ needs.verify.outputs.version }}" \
            --repo "${{ github.repository }}" \
            --tag "${{ needs.verify.outputs.tag }}" \
            --unnotarized "${{ needs.notarize.outputs.unnotarized }}" \
            --notes-from "${{ steps.notes.outputs.path }}" \
            --note release-note.md
      - uses: actions/upload-artifact@v4
        with:
          name: release-assembled
          path: artifacts
          if-no-files-found: error
      # 只创建 draft：产物清单与说明由人审阅后再点击发布，更新检查会跳过
      # draft，所以未发布前任何客户端都看不到它。
      - name: 创建 draft Release
        if: needs.verify.outputs.publish == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          set -euo pipefail
          args=(--draft --verify-tag --title "Armadra ${{ needs.verify.outputs.version }}" --notes-file release-note.md)
          # --verify-tag：标签不存在时拒绝，而不是替我们建一个指向当前提交的。
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "${args[@]}" artifacts/*
