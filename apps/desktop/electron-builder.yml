# electron-builder packaging configuration.
#
# `appId` and `productName` carry over unchanged from the shell this one
# replaced, so an existing installation upgrades in place rather than landing
# beside itself under a second identity (docs/design/electron-migration.md D10).
#
# The target list on every platform is one-for-one with
# `tools/release/artifacts.mjs` (`desktopAssets()`): six `<os>-<arch>` entries,
# three bundle kinds each. `apps/desktop/scripts/artifact-targets.test.mjs`
# checks that correspondence; changing either file without the other fails it.
appId: dev.armadra.desktop
productName: Armadra
# The package is `@armadra/desktop`, and electron-builder would otherwise derive
# the Linux binary name from it — `@armadradesktop`, which AppImage refuses as
# a file name. Every platform gets the same short executable name.
executableName: armadra
# The `out/` bundles and the core's migration files are placed into the
# unpacked app by this hook, not by `extraResources`: electron-builder copies
# once, and on the Windows runners that one copy meets a transient sharing
# violation. The hook retries (scripts/after-pack.mjs). It runs before signing,
# so everything it places is signed with the bundle as an extraResources entry
# would have been.
afterPack: ./scripts/after-pack.mjs

# 分享深链 `armadra://join?…`（客户端包 §6.2）：安装时登记 URL 协议（macOS
# Info.plist 的 CFBundleURLTypes、Windows 安装器的注册表项、Linux 桌面文件的
# x-scheme-handler）。壳运行时不调用 setAsDefaultProtocolClient，不改系统设置。
protocols:
  - name: Armadra
    schemes:
      - armadra

directories:
  # Named to match the blacklist entry `apps/desktop/release/` already
  # reserved for this in repo.rules.json and .gitignore (both predate this
  # file — see docs/guides/development.md §打包).
  output: release
  buildResources: build

# Only the electron-vite output and the manifest electron-builder itself needs
# to read (`main`, `version`, dependency list for asar-unpacking rules) are
# part of the app. Everything else — src/, scripts/, tests — stays out of the
# asar.
files:
  - out/**/*
  - package.json
  # `out/cli/` is deliberately NOT in the asar: after-pack.mjs places it
  # under `resources/cli/`, as a plain file the generated launcher can name
  # with an absolute path. Keeping a second copy in the archive would only
  # invite someone to point a hook at the one that needs asar support to be
  # readable.
  - "!out/cli/**/*"
  # `out/session-host/` is out for the same reason (R6d): the daemon is
  # started as `ELECTRON_RUN_AS_NODE=1 <Electron> <resources>/session-host/host.cjs`,
  # and that path has to be a real file on disk rather than an entry in an
  # archive only an asar-aware require can read.
  - "!out/session-host/**/*"
  # `out/agent/` (the bundled ama) and `out/agent-host/` (its host adapter)
  # likewise: after-pack.mjs places them under `resources/`, where the
  # `<data>/bin/ama` launcher and ama's `require` of the profile's `host` can
  # read them as plain files (docs/design/coordinator-agent.md §2.5).
  - "!out/agent/**/*"
  - "!out/agent-host/**/*"

# `node-pty` is the one native Node addon in this shell (R2, the TypeScript
# core's terminal domain). It must be OUTSIDE the asar: the addon resolves
# `build/Release/pty.node` and the `spawn-helper` executable relative to its
# own directory, and `posix_spawn` cannot execute a helper that lives inside
# an archive. Unpacking it is also what lets the macOS notarisation step see
# and sign a real Mach-O file rather than bytes in a blob.
#
# This entry and the `EXTERNAL` list in `electron.vite.config.ts` are one
# decision in two files: bundling the module would make this path empty, and
# unpacking without externalising would ship a copy nothing requires.
asarUnpack:
  - node_modules/node-pty/**

# This shell ships no sidecar binaries: the core is an `out/` bundle and runs
# on the Electron the app already carries. What `scripts/after-pack.mjs` places
# is `bundleResources()` (the hook client, and on Windows the session host) plus
# `migrationResources()` (the `.sql` files under `resources/migrations`, which is
# where `core/db/migrations.ts` looks in a packaged build). No platform section
# carries an `extraResources` list. Electron's `process.resourcesPath` is exactly
# that directory on every platform.
#
# The installer also carries the server shell for `Armadra serve`
# (`main/serve-launch.ts`): `resources/server/main.js` plus the desktop's own
# page as `resources/server/web/`, placed by the same hook (`serverResources()`).
# Its node-pty is the one unpacked above, reached through NODE_PATH.
#
# Only Windows ships the session host (T01: ConPTY sessions have to outlive the
# core there; tmux already does that job on macOS/Linux); the per-platform list
# is `bundleResources()` in after-pack.mjs, so nothing here can drift from what
# is placed.

mac:
  category: public.developer-tools
  icon: build/icons/icon.icns
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Whether this build actually notarizes is decided by
  # `scripts/signing-electron.mjs` before packaging starts (three-state
  # sign / skip / refuse): it reads the App Store Connect API key
  # (APPLE_API_KEY / APPLE_API_KEY_ID / APPLE_API_ISSUER) or, as the fallback,
  # APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID from the
  # environment and disables notarization here via `-c.mac.notarize=false`
  # when neither set is complete, the same "decide before the twenty-minute
  # build, not after" reasoning as docs/guides/ci-release.md §2.6.
  notarize: true
  extendInfo:
    # macOS 15+ gates any connection to an address on the user's own subnet
    # behind Local Network privacy, attributed to the RESPONSIBLE PROCESS —
    # for everything this shell spawns (the core, agent CLIs) that is
    # Armadra.app, not the child. Without this string there is no
    # prompt and no row in System Settings → Privacy & Security → Local
    # Network: the denial is silent and ungrantable, and it surfaces as
    # `EHOSTUNREACH` from an agent session while Apple-signed `/usr/bin/curl`
    # succeeds at the same instant. The reviewed allowlist is enforced by
    # `scripts/info-plist.test.mjs`.
    NSLocalNetworkUsageDescription: "Armadra 的 Runtime 与已连接的 Agent CLI 需要访问本机局域网内的设备与服务。"
    # The name macOS shows under the Dock icon, in Spotlight and in the Force
    # Quit list — distinct from `CFBundleName` (electron-builder derives that
    # from `productName` above), which is the shorter internal name the
    # system falls back to when this key is absent. Without it a build whose
    # `productName` ever needs a short/long split would silently show the
    # short form everywhere a user actually reads the app's name.
    CFBundleDisplayName: Armadra
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]

# How Windows is signed is not written here either. `win.azureSignOptions`
# (Azure Artifact Signing) makes electron-builder take the signing path the
# moment the block exists, without checking that its credentials do, so
# `scripts/signing-electron.mjs` merges it only when every AZURE_* value and
# ARMADRA_WIN_PUBLISHER_NAME are present; a certificate file (CSC_LINK) or a
# self-hosted runner's store (ARMADRA_WIN_CERT_SHA1) gets
# `win.signtoolOptions.publisherName` the same way. external-services §2.2.
win:
  icon: build/icons/icon.ico
  target:
    - target: nsis
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]
nsis:
  # electron-builder names the installer `Armadra Setup 0.1.0.exe` for every
  # architecture; tools/release/stage-desktop.mjs tells the two Windows
  # builds apart by an architecture token in the name, so the arm64 installer
  # was "not produced" as far as it could see. `${arch}` is `x64` / `arm64`.
  # No space anywhere: Azure Artifact Signing's PowerShell module splits the
  # file list on spaces and signs nothing (electron-builder #8626), and the
  # feed electron-builder writes spells the name with `-` anyway.
  artifactName: Armadra-Setup-${version}-${arch}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

# The deb/rpm defaults spell the file from the package *name*, and ours is
# scoped: `@armadra/desktop_0.1.0_amd64.deb` is a path into a directory that
# does not exist, and fpm stops there. `${arch}` is electron-builder's token
# (`x64` / `arm64`), which tools/release/stage-desktop.mjs reads the same way
# it reads the AppImage's.
deb:
  artifactName: ${productName}_${version}_${arch}.${ext}
  # electron-builder's default list plus the two libraries Electron links that
  # it leaves out: on a clean Ubuntu 22.04 `apt install` succeeded and the app
  # then failed to start on `libgbm.so.1` / `libasound.so.2` (found by
  # tools/probes/deb-install.mjs; libgbm1 also brings libdrm2,
  # libwayland-server0 and libxcb-randr0). `libasound2` is still satisfied on
  # 24.04 and Debian 13, where libasound2t64 provides it.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libgbm1
    - libasound2
rpm:
  artifactName: ${productName}-${version}.${arch}.${ext}

linux:
  icon: build/icons/icon.png
  category: Development
  # Electron takes the Wayland app_id / X11 WM_CLASS from `desktopName` in
  # package.json; without it the running window does not match the installed
  # `armadra.desktop` and docks show a generic icon beside the launcher. The
  # flag names the .desktop file and its StartupWMClass after the same value.
  syncDesktopName: true
  target:
    - target: AppImage
      arch: [x64, arm64]
    - target: deb
      arch: [x64, arm64]
    - target: rpm
      arch: [x64, arm64]

# Left empty in the repository: the address a *published* release polls must
# never be baked into a build that isn't one. CI injects it from
# ARMADRA_UPDATER_ENDPOINTS (scripts/signing-electron.mjs); a local `dist`
# build sets `extraMetadata.armadraUpdates = "disabled"` instead (see
# `scripts/dist.mjs`) so it never polls this even if it were filled in.
publish:
  provider: generic
  url: https://armadra.dev/updates
