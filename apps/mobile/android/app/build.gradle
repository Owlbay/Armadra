apply plugin: 'com.android.application'

// 移动端与桌面同一条版本线（docs/guides/ci-release.md「版本规则」）：版本名与版本号都来自
// apps/mobile/scripts/app-version.mjs 写出的 version.properties（不入库）——版本名是
// apps/mobile/package.json 的 version，版本号是单调递增的构建号（ARMADRA_BUILD_NUMBER 或提交数），
// 与 iOS 的 MARKETING_VERSION / CURRENT_PROJECT_VERSION 同出一处。
def appVersionFile = file('version.properties')
if (!appVersionFile.exists()) {
    throw new GradleException("缺 ${appVersionFile}：先跑 node apps/mobile/scripts/app-version.mjs write（pnpm --filter @armadra/mobile sync 已带）")
}
def appVersionProps = new Properties()
appVersionFile.withInputStream { appVersionProps.load(it) }
def appVersion = [
    versionName: appVersionProps.getProperty('versionName'),
    versionCode: appVersionProps.getProperty('versionCode')?.toInteger(),
]
if (!appVersion.versionName || !appVersion.versionCode) {
    throw new GradleException("${appVersionFile} 缺 versionName 或 versionCode：重新跑 node apps/mobile/scripts/app-version.mjs write")
}
def releaseKeystore = System.getenv('ANDROID_UPLOAD_KEYSTORE')

android {
    namespace = "dev.armadra.mobile"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "dev.armadra.mobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersion.versionCode
        versionName appVersion.versionName
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // 发布签名只来自环境（外部服务 §5.1 的上传密钥），仓库里没有任何密钥；没配时
    // release 包不签名，只有 debug 包可装。
    signingConfigs {
        if (releaseKeystore) {
            release {
                storeFile file(releaseKeystore)
                storePassword System.getenv('ANDROID_UPLOAD_KEYSTORE_PASSWORD')
                keyAlias System.getenv('ANDROID_UPLOAD_KEY_ALIAS')
                keyPassword System.getenv('ANDROID_UPLOAD_KEY_PASSWORD') ?: System.getenv('ANDROID_UPLOAD_KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (releaseKeystore) signingConfig signingConfigs.release
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':armadra-native-core')
    implementation "com.google.firebase:firebase-messaging:$firebaseMessagingVersion"
    implementation "com.google.android.gms:play-services-code-scanner:$playServicesCodeScannerVersion"
    implementation "org.unifiedpush.android:connector:$unifiedPushConnectorVersion"
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test:runner:$androidxTestRunnerVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

// UnifiedPush 连接库依赖 JVM 版 Tink（带 protobuf-java 与桌面用的 conscrypt）；Android 上换成同版本的
// tink-android（自带精简的 protobuf）。
configurations.configureEach {
    resolutionStrategy.dependencySubstitution {
        substitute module('com.google.crypto.tink:tink') using module("com.google.crypto.tink:tink-android:$tinkAndroidVersion")
    }
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
