packages:
  - apps/web
  - apps/desktop
  - apps/server
  - packages/*

allowBuilds:
  esbuild: true
  # Electron's postinstall is what downloads the runtime binary; without it
  # `electron-vite dev` has nothing to launch.
  electron: true
  # electron-builder's Squirrel.Windows dependency; unused (we ship NSIS, not
  # Squirrel), so its postinstall script does not need to run.
  electron-winstaller: false
  # Deliberately false. node-pty's own install script compiles against the
  # *Node* ABI, and what this repository needs is a patched source compiled
  # against *Electron's* — so `apps/desktop/scripts/ensure-electron.mjs` runs
  # `patch-node-pty.mjs` and then `electron-rebuild` instead. Letting pnpm
  # build it here would produce an artefact that is both unpatched and, in the
  # shell, unloadable.
  node-pty: false

minimumReleaseAgeExclude:
  - "@xyflow/react@12.11.3"
  - "@xyflow/system@0.0.80"
  - react-resizable-panels@4.12.4
  - electron@42.11.6
  - "@armadra/agent@0.6.5"

storeDir: .pnpm-store

# Security overrides for transitive dependencies. Each entry is scoped to the
# vulnerable range only and pins the minimum patched release; the parents'
# own ranges already admit it, so these only stop the lockfile from holding a
# vulnerable copy. Drop an entry once its parents resolve past it on their own.
overrides:
  # GHSA-rfgv-xxqx-mfg5, GHSA-w293-vg96-wgc3, GHSA-pmjh-fq2x-6v4x,
  # GHSA-3xpg-4rpp-hhhm, GHSA-2jfj-6hjv-fm6j, GHSA-rx4f-c7p8-82vq,
  # GHSA-r53p-7pc4-xj5r, GHSA-2gqq-gqf2-x968, GHSA-8436-99hf-9mmv: undici 7.x
  # before 7.29.1. Pulled in by shadcn (and its @dotenvx/dotenvx) in the web
  # app and by electron's @electron/get; undici 6.x/8.x are unaffected.
  "undici@>=7.0.0 <7.29.1": 7.29.1
  # GHSA-6j4f-fj2g-mc7p, GHSA-qhr7-859c-m2p7, GHSA-q2hr-2g5m-vwhr:
  # brace-expansion 4.x/5.x before 5.0.12. Pulled in via minimatch 10 by
  # shadcn's ts-morph and by electron-builder's app-builder-lib; the 1.x/2.x
  # copies used elsewhere are unaffected.
  "brace-expansion@>=4.0.0 <5.0.12": 5.0.12
  # GHSA-h3mg-xc3c-68pw, GHSA-j6r3-76f7-8jcv: ip-address before 10.7.1.
  # Pulled in by shadcn through socks and @modelcontextprotocol/sdk's
  # express-rate-limit.
  "ip-address@<10.7.1": 10.7.1
  # GHSA-hxh3-vqpv-xpqv: hono before 4.13.7. Pulled in by shadcn's
  # @modelcontextprotocol/sdk (directly and via @hono/node-server).
  "hono@<4.13.7": 4.13.7
  # GHSA-hrr3-gc8f-f4qj: fast-uri 3.x before 3.1.8. Pulled in through ajv 8 by
  # shadcn (@modelcontextprotocol/sdk, @dotenvx/dotenvx's conf) and by
  # electron-builder's app-builder-lib.
  "fast-uri@>=3.0.0 <3.1.8": 3.1.8
  # GHSA-p98j-92pf-mc4p: dompurify 3.4.13–3.4.15. Pulled in by mermaid in the
  # web app; mermaid's latest release still accepts the vulnerable range, so a
  # mermaid bump alone would not move it.
  "dompurify@>=3.4.13 <3.4.16": 3.4.16
  # 整棵树只留一份 `@peculiar/asn1-schema`（不是安全修复，是正确性）。它按模块
  # 实例登记 ASN.1 结构：`@simplewebauthn/server` 与 `@peculiar/x509` 解析到
  # 2.9.4、而 `asn1-ecc` 用 2.10.0 时，ES256 签名的解包在 2.9.4 的登记表里找
  # 不到 `ECDSASigValue`，passkey 断言一律校验失败。
  "@peculiar/asn1-schema": 2.10.0
